[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blurring_as_a_service"
version = "2.2.2"
description = "Blurring of people and license plates in images."
authors = [
    {name = "Daan Bloembergen", email = "d.bloembergen@amsterdam.nl"},
    {name = "Sebastian Davrieux", email = "s.davrieux@amsterdam.nl"},
    {name = "Chris Eijgenstein"},
    {name = "Diana Epureanu", email = "d.epureanu@amsterdam.nl"},
    {name = "Andrea Lombardo", email = "a.lombardo@amsterdam.nl"},
]
maintainers = [
    { name = "Computer Vision Team, Gemeente Amsterdam", email = "cvt@amsterdam.nl" },
]
requires-python = ">=3.10"
dependencies = [
    "aml_interface",
    "cvtoolkit",
    "yolo_model_development_kit",
    "azure-cli>=2.67.0",
    "psycopg2>=2.9.10",
]

[project.optional-dependencies]
dev = [
    "ipykernel==6.*",
    "pre-commit>=3.2.0",
    "pytest>=7.0.1",
    "pytest-cov>=4.0.0",
    "safety>=3.2.4",
]
cpu = [
  "torch>=2.13.0",
  "torchvision>=0.26.0",
]
cu126 = [
  "torch>=2.13.0",
  "torchvision>=0.26.0",
]

[project.scripts]
create_azure_env = "blurring_as_a_service.create_aml_environment.create_azure_env:main"
run_pre_inference_pipeline = "blurring_as_a_service.pre_inference_pipeline.submit_pre_inference_pipeline:main"
run_inference_pipeline = "blurring_as_a_service.inference_pipeline.submit_inference_pipeline:main"
run_count_images_pipeline = "blurring_as_a_service.count_images_pipeline.submit_count_images_pipeline:main"

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
  ],
]
package = true
prerelease = "allow"

[tool.uv.sources]
aml_interface = { git = "https://github.com/Computer-Vision-Team-Amsterdam/AML-Interface.git", tag = "v1.1.5" }
cvtoolkit = { git = "https://github.com/Computer-Vision-Team-Amsterdam/CVToolkit.git", tag = "v2.0.7" }
yolo_model_development_kit = { git = "https://github.com/Computer-Vision-Team-Amsterdam/YOLO-model-development-kit.git", tag = "v1.4.7" }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
include=["blurring_as_a_service", "blurring_as_a_service.*", "tests"]

[tool.isort]
profile = "black"
multi_line_output = 3
