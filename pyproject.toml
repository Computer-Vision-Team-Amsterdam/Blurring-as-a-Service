[project]
name = "blurring_as_a_service"
version = "2.2.1"
description = "Blurring of people and license plates in images."
authors = [
    {name = "Daan Bloembergen", email = "d.bloembergen@amsterdam.nl"},
    {name = "Sebastian Davrieux", email = "s.davrieux@amsterdam.nl"},
    {name = "Chris Eijgenstein", email = ""},
    {name = "Diana Epureanu", email = "d.epureanu@amsterdam.nl"},
    {name = "Andrea Lombardo", email = "a.lombardo@amsterdam.nl"},
]
maintainers = [
    { name = "Computer Vision Team, Gemeente Amsterdam", email = "cvt@amsterdam.nl" },
]
requires-python = ">=3.10"
dependencies = [
    "yolo_model_development_kit",
    "azure-cli>=2.67.0",
    "psycopg2>=2.9.10",
    "azureml-core>=1.59.0",
    "azureml-inference-server-http>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel==6.*",
    "pre-commit>=3.2.0",
    "pytest>=7.0.1",
    "pytest-cov>=4.0.0",
    "safety>=3.2.4",
]
cpu = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
]
cu128 = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu128" },
  ],
]
prerelease = "allow"

[tool.uv.sources]
yolo_model_development_kit = { git = "https://github.com/Computer-Vision-Team-Amsterdam/YOLO-model-development-kit.git", tag = "v1.4.7" }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.isort]
profile = "black"
multi_line_output = 3
